version: 2

# Dependabot konfig — Beslutning L3 (vuln-scan + auto-bump) + [review]-tsunami-fix 06-19:
#   - Bredere stack-grupperinger: én PR pr. økosystem (otel/sentry/test/ts-stack/connect/hono)
#     i stedet for én pr. dep. Mål: ~6 PRs/uge i stedet for 20+ pr. repo
#   - update-types: [minor, patch] på alle stack-grupperinger → ingen major-bumps via dependabot
#     (major-bumps kører quarterly koordineret cross-repo for at undgå version-divergence)
#   - "remainder"-grupperinger (prod-misc + dev-misc) for deps der ikke er i en defineret stack
#   - GH Actions: separat grouping, auto-merge-kompatibel via Approval Agent-allowlist

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    ignore:
      # v3 ændrede invocations-modellen (required build-script + intern
      # install/build af base+head-ref) på en måde der er inkompatibel med
      # size-check-jobbets "mål pre-byggede artifacts"-design — brød Bundle
      # Size Check på al develop (#67). Pinnet til v2 i ci.yml indtil jobbet
      # evt. redesignes bevidst; ignorér major-bumps så loopet ikke gentages.
      - dependency-name: 'preactjs/compressed-size-action'
        update-types: [version-update:semver-major]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Reduceret fra 10 til 8 — vi vil hellere have bredere groupings end mange små PRs
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
      - npm
    # Ignore-regler. Grupperne nedenfor kapper majors via `update-types:
    # [minor, patch]`, MEN det gælder kun bumps der matcher en gruppe — en
    # ukategoriseret pakke (fx expo-*, der falder i prod/dev-remainder) får
    # stadig en INDIVIDUEL major-PR udenom gruppen. Det er hullet der lod
    # expo-symbols 1→57 (#75) + expo-linking 8→57 (#71) slippe igennem: begge
    # følger egen semver-linje, men dependabot matchede Expo SDK-meta-versionen
    # (57) fra den SDK-alignede tag-stream. Expo-pakker bumpes samlet med hele
    # SDK'et (quarterly-sprintet), aldrig pr. pakke.
    ignore:
      - dependency-name: 'expo'
        update-types: [version-update:semver-major]
      - dependency-name: 'expo-*'
        update-types: [version-update:semver-major]
    groups:
      # ─── Cross-service stacks — koordineret version på tværs af alle services ───
      otel-stack:
        patterns:
          - '@opentelemetry/*'
        update-types: [minor, patch]
      sentry-stack:
        patterns:
          - '@sentry/*'
          - 'sentry-*'
        update-types: [minor, patch]
      connect-stack:
        patterns:
          - '@connectrpc/*'
          - '@bufbuild/*'
        update-types: [minor, patch]
      test-stack:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jest'
          - '@jest/*'
          - '@testing-library/*'
          - 'jsdom'
          - 'happy-dom'
        update-types: [minor, patch]
      ts-stack:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
        update-types: [minor, patch]
      eslint-prettier-stack:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - 'prettier'
          - 'prettier-*'
        update-types: [minor, patch]
      commitlint-husky-stack:
        patterns:
          - '@commitlint/*'
          - 'commitlint'
          - 'husky'
          - 'lint-staged'
        update-types: [minor, patch]
      changesets-stack:
        patterns:
          - '@changesets/*'
        update-types: [minor, patch]
      # ─── Hono/Fastify-server-stacks (service-repos) ───
      hono-server-stack:
        patterns:
          - 'hono'
          - '@hono/*'
        update-types: [minor, patch]
      fastify-server-stack:
        patterns:
          - 'fastify'
          - '@fastify/*'
        update-types: [minor, patch]
      # ─── Auth/DB-stacks ───
      betterauth-stack:
        patterns:
          - 'better-auth'
          - 'better-auth-*'
        update-types: [minor, patch]
      drizzle-stack:
        patterns:
          - 'drizzle-orm'
          - 'drizzle-*'
          - '@drizzle-team/*'
        update-types: [minor, patch]
      # ─── Frontend-stacks (apps der bruger Nuxt/Vue/React) ───
      nuxt-stack:
        patterns:
          - 'nuxt'
          - 'nuxt-*'
          - '@nuxt/*'
          - '@nuxtjs/*'
        update-types: [minor, patch]
      vue-stack:
        patterns:
          - 'vue'
          - '@vue/*'
          - 'vue-*'
          - 'eslint-plugin-vue'
        update-types: [minor, patch]
      # ─── Remainder-grupperinger ───
      # Fanger alt der IKKE er i en specifik stack — undgår individual PRs for små bumps.
      prod-remainder:
        dependency-type: production
        update-types: [minor, patch]
      dev-remainder:
        dependency-type: development
        update-types: [minor, patch]
# Major-bumps håndteres IKKE af dependabot — kør quarterly koordineret cross-repo
# sprint (Q1/Q2/Q3/Q4) hvor [quality] åbner template-PR med samme version overalt.
# Cross-service traces kan break hvis versioner divergerer (især otel-stack).
