# Prerelease "next" channel for the @grundtone/vue consumer graph.
#
# Ruling (b) by [infra]/CTO: publish from develop under the `next` npm dist-tag
# WITHOUT changesets. This keeps the prerelease channel fully decoupled from the
# changesets/freeze machinery — it never touches `latest` and never trips the
# "Guard frozen 2.x packages" guard (that guard only evaluates changesets; this
# path has none). The main/develop reconciliation remains the clean long-term
# fix; `next` is the interim so studio/etude/resonans can consume the new
# components (GTAppShell/GTDrawer/GTConfirmDialog/GTCodeBlock/GTMeter/GTRichText
# + @grundtone/mcp) now.
#
# Manual-dispatch only: the first publish is outward-facing (public npm), so
# rollout gates on an Allan-go (typing "publish" in the confirm input).
#
# ── AUTH: npm OIDC trusted publishing, no token ─────────────────────────────
# History, because this comment carries an EXTERNAL fact and those expire:
# - 2026-08-03 ([infra] review, option B): npm allowed ONE trusted publisher
#   per package, and release.yml held it. TRUE then. This channel therefore
#   ran on a granular automation token (NPM_PRERELEASE_TOKEN, repo level).
# - 2026-09-03: npm allowed several trusted publishing configurations per
#   package (github.blog/changelog/2026-09-03-multiple-trusted-publishing-
#   configurations-for-npm). The reason for the token was gone.
# - 2026-10-22: measured again. docs.npmjs.com/trusted-publishers: "Each
#   package can have up to 10 trusted publishers". This workflow now
#   publishes through its OWN trusted publisher per package, which names
#   `prerelease-next.yml` and environment `npmjs-prerelease`.
# Two traps in that setup, both from GitHub's changelogs:
# - A new configuration only STAGES by default; "Direct publishing is opt-in
#   per configuration". Without it this job ends green with nothing on npm,
#   which is why the last step reads the registry back.
# - An unvalidated configuration expires 48 hours after creation
#   (changelog 2026-10-02); the first successful publish validates it.
# `npm publish` must stay in THIS file: npm validates the entry workflow's
# filename, so a shared workflow_call publish job would break the binding.
# 2. Package set: core/utils/icons/design-system/vue/nuxt/mcp (see
#    scripts/prerelease-next-version.mjs). email + react-native are excluded.
# 3. Trigger ownership: infra owns when this runs (manual for now).

name: Prerelease (next)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing @grundtone/*@next to npm'
        required: true
        type: string

concurrency:
  group: prerelease-next
  cancel-in-progress: false

jobs:
  prerelease:
    # Only from develop, only on explicit confirmation.
    if: ${{ github.ref == 'refs/heads/develop' && inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    # The npm trusted publisher for each package names this environment, and
    # the environment only admits develop. The `if:` above is the second layer.
    environment: npmjs-prerelease
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # .nvmrc frem for en hardcodet major: repoets engines.node kræver
          # >=24.15.0, og en pinnet 22 fejlede installen med
          # ERR_PNPM_UNSUPPORTED_ENGINE før publish-steppet overhovedet blev
          # nået (første rigtige kørsel, 2026-08-04). Filen er i forvejen
          # kilden i ci.yml, så næste Node-bump følger automatisk med her.
          node-version-file: '.nvmrc'
          # Deliberately NO `registry-url:`. It writes an .npmrc authToken line
          # from NODE_AUTH_TOKEN; with no token that line is empty, and npm
          # stops at ENEEDAUTH instead of trying the OIDC exchange (same as
          # release.yml).

      # Trusted publishing needs npm >= 11.5.1; npm's docs ask >= 11.21.0 for
      # dist-tags with OIDC, and this job publishes under `next`. Exact pin, so
      # that question cannot reopen on a new 11.x.
      - name: npm CLI that supports OIDC dist-tags
        run: npm install -g npm@11.21.1

      - name: Install
        run: pnpm install --frozen-lockfile

      # 🔴 HÅRD GATE — dette er leddet der ikke kan fortrydes.
      #
      # Ligger FØR stemplingen med vilje: den skal måle det, git siger, ikke
      # det, stemplingen lige har skrevet. Der er et tilsvarende check på
      # develop-PRs (ci.yml), men det er den tidlige advarsel — dette her er
      # det der forhindrer et forbigået PR-check i at nå registret.
      #
      # Baggrund (2026-08-05): alle syv pakker var BAGUD for npm `latest`,
      # fordi releases cuttes fra main/frozen-2.x og aldrig flyder tilbage til
      # develop. Uden denne gate ville kørslen have publiceret fx
      # @grundtone/vue@2.15.0-next.N mens `latest` var 2.23.3 — en kanal der
      # udgav sig for at være ældre kode end den udgivne. Kun en EOTP-fejl på
      # tokenet forhindrede det. npm-unpublish er 72 timer og frarådet, så
      # den fejl ville have stået permanent.
      - name: Gate — develop must be ahead of npm latest
        run: node scripts/assert-develop-ahead-of-latest.mjs

      - name: Stamp <base>-next.<run> versions
        run: node scripts/prerelease-next-version.mjs "${{ github.run_number }}"

      - name: Build the consumer graph
        run: >-
          pnpm turbo run build
          --filter=@grundtone/vue
          --filter=@grundtone/nuxt
          --filter=@grundtone/mcp

      # 🔴 Sidste vagt foer et publish der ikke kan goeres om (npm unpublish er
      # 72 timer og frarådet). Version-drift-gaten ovenfor asserterer at develop
      # er NYERE end latest — den er groen saa laenge 2.24.0 > 2.23.3, uanset
      # hvad versionerne INDEHOLDER. Maalt 2026-08-19: den udgivne @grundtone/vue
      # har 20 offentlige eksporter develop ikke har (GTFooter, GTHeader,
      # GTMasonry, hele theme-typefladen, createTheme, iconRegistry). Et publish
      # ville slette dem og levere det som en opgradering.
      #
      # Gaten staar HER og ikke i ci.yml med vilje: den skal blokere den farlige
      # HANDLING, ikke alt arbejde. Et kendt tab maa ikke goere hver urelateret
      # PR roed — men det skal vaere umuligt at UDGIVE det uden at erklaere det
      # i .api-removals.json (og dermed vaelge en major bump).
      #
      # Koeres EFTER build, fordi den sammenligner bygget .d.ts mod bygget
      # .d.ts. Sammenlignes kilde mod bygget, rapporterer den falske tab for
      # hver `export *` — maalt: 126 falske paa foerste forsoeg.
      - name: Intet offentligt API går tabt ved publish
        run: node scripts/assert-no-public-api-loss.mjs

      # Samme spoergsmaal som ovenfor, men stillet til ALLE udgivelige pakker
      # frem for de syv i next-kanalen. De to overlapper og erstatter ikke
      # hinanden.
      # Egenskaben, ikke raekkefoelgen. 2026-08-23 blev release-PR'en merget
      # foer den nuxt-rettelse, den var betinget af; betingelsen stod kun i
      # beskeder mellem mennesker. Udgivelsen blev stoppet — men af
      # nedgraderings-vagten, paa en anden pakke der tilfaeldigvis stod bagud.
      # Vaernet virkede ved SAMMENFALD, ikke ved design.
      #
      # Denne gate eksekverer det BYGGEDE modul og fejler, hvis wiringen ikke
      # er der. Den holder uanset merge-raekkefoelge og uanset om nogen husker
      # betingelsen om tre maaneder.
      # 🔴 Vuln-gaten koerer OGSAA her, ikke kun i ci.yml.
      #
      # Maalt 2026-08-24: `Security Audit` (pnpm audit) er required og blokerer
      # PR'er — men hverken den eller osv koerte paa nogen udgivelsessti. En
      # saarbar transitiv dependency kunne dermed shippe til forbrugerne af ni
      # offentlige pakker uden at stoppe udgivelsen. Samme figur som
      # nedgraderings-vagten: vaernet paa PR-niveau, den uigenkaldelige handling
      # ved merge.
      #
      # Adopteres scanneren KUN i ci.yml, har vi to scannere paa PR-stien og
      # stadig nul her — hullet uaendret, med et groent flueben foran.
      - name: Vuln-scan før publish
        run: |
          # 🔴 CHECKSUM FØR FØRSTE EKSEKVERING (riff kqnlreckpjgm8mvjot6wvrum).
          # Formen var curl → chmod +x → `--version`: den spørger den
          # UVERIFICEREDE binær hvem den er, og kører den for at få svaret.
          # En to-linjers stub der printer versionen består.
          # Digest'et står i GIT — ikke hentet fra udgivelsens egen SHA256SUMS:
          # den kommer fra samme udgivelse som binæren og dækker transportfejl,
          # ikke en byttet udgivelse. En digest i git er et løfte nogen har målt,
          # og som en diff kan se ændre sig.
          set -euo pipefail
          OSV_SHA256="d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          rm -f /tmp/osv-scanner
          osv-scanner --recursive --skip-git --config=osv-scanner.toml ./

      # Accepterne skal ogsaa vaere gyldige HER: en udloebet accept maa ikke
      # kunne baere en udgivelse igennem, bare fordi scannen selv siger groent.
      - name: Vuln-accepter er ikke udløbet
        env:
          OSV_EXPECTED: '8'
        run: python3 .github/scripts/assert-osv-ignores-expire.py osv-scanner.toml

      - name: Udgivelses-invarianter holder på artefaktet
        run: node scripts/assert-release-invariants.mjs

      - name: Ingen pakke udgives som en nedgradering
        run: node scripts/assert-no-downgrade-publish.mjs

      - name: Publish @next
        # pnpm rewrites workspace:* deps to the stamped -next version, so the
        # published graph is self-consistent. --no-git-checks: the stamp dirties
        # the tree on purpose. Prerelease versions never become `latest`.
        # No NODE_AUTH_TOKEN: an empty one would short-circuit npm to
        # ENEEDAUTH before it attempts the OIDC exchange.
        run: >-
          pnpm publish
          --filter=@grundtone/core
          --filter=@grundtone/utils
          --filter=@grundtone/icons
          --filter=@grundtone/design-system
          --filter=@grundtone/vue
          --filter=@grundtone/nuxt
          --filter=@grundtone/mcp
          --tag next
          --no-git-checks
          --access public

      # 🔴 UNCONDITIONAL read-back. A configuration without direct publishing
      # STAGES and the publish step still exits 0, so green here must mean
      # "the registry serves it", not "the command did not fail".
      - name: Every package is on npm under next
        if: always()
        run: |
          set -euo pipefail
          fail=0
          for dir in core utils icons design-system vue nuxt mcp; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            want=$(node -p "require('./packages/$dir/package.json').version")
            got=$(npm view "$name" dist-tags.next 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "ok   $name@next = $want"
            else
              echo "::error::$name@next is '${got:-<none>}', expected $want (staged or not published)"
              fail=1
            fi
          done
          exit "$fail"
