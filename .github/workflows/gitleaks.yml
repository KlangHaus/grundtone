name: Gitleaks

# Kun pull_request — IKKE push på main/develop.
# Begrundelse: pre-merge gitleaks-scan på PR fanger secrets før de når main.
# Push på main efter merge ville scanne det allerede-merged commit = duplicate work
# + fakturerer minutter dobbelt på samme indhold ([review] systemic fund 06-18).
# Hvis main alligevel skal scannes som backup, kør weekly cron + leakage-detection-
# rapport — ikke per-commit.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repo history
        run: gitleaks detect --redact --verbose --exit-code 1
