name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 🔴 Titlen gaar gennem env og IKKE ind i `run:`-strengen. Interpoleres
      # `${{ ... }}` direkte i en shell-kommando, bliver den en del af scriptet
      # FOER shellen parser det — og en PR-titel er angriber-kontrolleret, saa
      # `$(...)` eller backticks i en titel ville eksekvere paa runneren.
      # commitlint.yml gjorde det allerede rigtigt; denne var kopien der ikke.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  setup:
    name: Setup & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      # Koeres EFTER build, fordi den maaler den BYGGEDE stylesheet. Kilden
      # fortaeller hvad nogen skrev; kun resultatet fortaeller, hvad der endte
      # med at vaere defineret. En `var(--x)` uden fallback og uden definition
      # kasseres af browseren sammen med hele deklarationen — den ser rigtig ud
      # i baade diff og grep og goer ingenting. Maalt 2026-08-20: 61 saadanne,
      # den aeldste fra marts.
      #
      # Denne staar i ci.yml og ikke kun paa publish-stien, fordi den er groen
      # i dag: der er ingen kendt tilstand, den ville goere hver PR roed paa.
      # Et environment uden protection_rules venter ikke paa nogen — men
      # `environment:` i en workflow LIGNER en godkendelses-gate og bliver
      # refereret som et vaern. Maalt i studio i dag: to jobs bag environments
      # med tomme regler. Undtagelser skal erklaeres i scriptet, ikke antages.
      - name: Refererede environments beskytter noget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/assert-environment-gates.mjs

      - name: Ingen døde CSS-deklarationer
        run: node scripts/assert-no-undefined-css-vars.mjs packages/design-system/dist/index.css packages/vue/dist/index.css

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/vue/scss
          retention-days: 1

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Run ESLint
        run: pnpm lint:js:check

      - name: Run Stylelint
        run: pnpm lint:styles:check

      - name: Check formatting
        run: pnpm lint:format

      - name: Type check
        run: pnpm typecheck

      # 🔴 Vendorede assets FRYSER. Scriptet kan opdage det, men et script der
      # aldrig koeres beskytter intet — praecis den klasse dets egen kommentar
      # citerer (studio#225: en placeholder-logo overlevede maaneder, fordi
      # ingen kunne se at kopien var gammel). [review]-fund paa #142: scriptet
      # optraadte ingen steder i CI. Verify-tilstanden exiter 1 ved drift.
      - name: Hero-ikoner svarer til kilden
        run: node apps/web/scripts/vendor-hero-icons.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 Changeset-ceremonien koerer SIDST med vilje. Den stod foerst indtil
      # 2026-08-19, hvor en falsk roed fra frozen-2.x-guarden faeldede jobbet
      # FOER ESLint, Stylelint, formatering, typecheck og drift-gaten — fem
      # substantielle checks skjult af én ceremoniel. Man retter saa det gaten
      # raaber om og opdager foerst bagefter at der laa noget under.
      # Raekkefoelgen i et flertrins-job er ikke kun et spoergsmaal om
      # hastighed: den afgoer hvad man overhovedet FAAR at vide, naar noget
      # fejler. ([projektleder]s sidefund paa #146.)
      # Dependabot bumps deliberately carry no changeset: merging a deps bump
      # must not force a release of the linked packages. (Until 3.0.0 the reason
      # given here was "publish-frozen until the main/develop reconciliation" —
      # that reconciliation is decided and the freeze is gone, but the reason
      # for skipping dependabot is unchanged: a dependency bump is not a reason
      # to cut a release.) Failing this step also aborted the
      # job before ESLint/typecheck ever ran, so dependabot PRs got NO lint
      # signal at all. Skip the gate for dependabot, keep the real checks.
      # 🔴 Springes over paa changesets' EGEN version-PR. Den PR FORBRUGER
      # changesets — den sletter dem og bumper versionerne — saa "pakker er
      # aendret, men ingen changesets fundet" er strukturelt garanteret dér.
      # Checket kan ikke bestaa, og den roede er derfor uden information.
      # Maalt paa #157: `Some packages have been changed but no changesets were
      # found`, paa den PR der netop havde brugt dem.
      #
      # Bundet til GRENEN og ikke til aktoeren: aktoeren varierer mellem
      # oprettelse og gen-koersel (maalt paa #157: actor=github-actions[bot],
      # triggering_actor=allanasp), mens `changeset-release/*` er changesets'
      # faste gren-praefiks. En betingelse paa noget der skifter, holder kun
      # indtil nogen trykker "re-run".
      - name: Check for changesets
        if: |
          github.base_ref == 'develop'
          && github.actor != 'dependabot[bot]'
          && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset:status --since=origin/develop

  test:
    name: Test
    runs-on: ubuntu-latest
    # 🔴 Uden timeout er GitHubs default 360 min. En REQUIRED check der haenger
    # blokerer saa hver PR i op til seks timer som "pending" — hverken ja eller
    # nej. Maalt 2026-08-19: Playwright-installationen hang 21 min paa #138 og
    # tre gange i traek paa #143, uden at testene startede. En haengning skal
    # blive en FEJL man kan genstarte ([quality] 7cf4465; samme mangel fundet i
    # 67 required jobs paa tvaers af 13 repos).
    #
    # 20 og ikke 15: maalt varighed for install alene er 3,8-5,2 min, og
    # testene tager ~2. Et jobloft skal ligge over NORMAL + varians, ellers
    # faelder det arbejde der virker.
    timeout-minutes: 20
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      # Cachen fjerner den hyppigste aarsag til haengningen: selve downloaden.
      # Foerste koersel installerer stadig — og faelder paa step-timeouten i
      # stedet for at staa i timevis.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 🔴 10 og ikke 5: min foerste taerskel var sat paa en ANTAGELSE om at
      # langsom == haengt. Maalt samme dag: 3,8 min (groen) og 5,2 min (faeldet
      # af den 5-minutters graense) — installationen er legitimt langsom, ikke
      # haengt, fordi --with-deps ogsaa henter OS-pakker. En timeout under
      # normal-plus-varians faelder arbejde der virker; den skal ligge over,
      # men langt under de 21 min en aegte haengning tog.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/test-results.xml'
          retention-days: 30
          if-no-files-found: ignore

      - name: Coverage Report
        uses: codecov/codecov-action@v7
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: './coverage/lcov.info,**/coverage/lcov.info'
          fail_ci_if_error: false
          verbose: true

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      # Pinnet til v2 bevidst. v3 gjorde build-script required OG ændrede
      # invocations-modellen til `exec(buildScript)` (rå kommando) + install
      # og build af BÅDE base- og head-ref internt — inkompatibelt med dette
      # jobs "download pre-byggede artifacts og mål dem"-design (#67's v2→v3-
      # bump brød Bundle Size Check på al develop). At adoptere v3 kræver at
      # redesigne jobbet (install-script/clean-script til pnpm-workspace) —
      # bevidst udskudt. Major-bumps af denne action ignoreres i dependabot.yml.
      - name: Analyze bundle size
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'packages/*/dist/**/*.{js,css}'
          exclude: '{**/*.map,**/node_modules/**}'
          compression: gzip

  # Fanger main→develop-driften DÉR hvor den opstår, frem for den dag vi vil
  # udgive. Rodårsagen er ikke versionsnumre, men at releases fra
  # main/frozen-2.x aldrig flyder tilbage til develop — så uden dette check
  # står vi samme sted efter næste main-release. Der er en TILSVARENDE hård
  # gate i prerelease-next.yml før publish; denne her er den tidlige advarsel,
  # den anden er den der ikke kan omgås. Begge er nødvendige.
  version-drift:
    name: Version drift (develop ahead of npm latest)
    runs-on: ubuntu-latest
    # KUN på develop-PR'er. På main ER de udgivne versioner `latest` — main
    # er dét, npm har fået — så "strengt højere" er per definition falsk dér,
    # og gaten ville gøre enhver main-PR rød uden at der var noget galt.
    # Kravet gælder develop, fordi det er develop `next` stempler fra.
    if: github.base_ref == 'develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # Ingen pnpm install: scriptet læser package.json-filer og kalder
      # `npm view`. Det holder checket hurtigt og uafhængigt af lockfilen.
      - name: Assert every next-channel package is ahead of latest
        # --allow-equal: lighed er den NORMALE tilstand paa en PR lige efter en
        # udgivelse, fordi develop selv er udgivelseslinjen. Udgivelsesstien
        # (prerelease-next.yml) koerer UDEN flaget og kraever stadig strengt
        # stoerre — dér ville lighed udgive en prerelease under sin egen release.
        run: node scripts/assert-develop-ahead-of-latest.mjs --allow-equal

  # C8 — artefakt-bevis. At bygge i monorepoet beviser kun at TypeScript kan
  # se filerne; denne gate pakker de 9 udgivne pakker og installerer dem fra
  # tarballs i et TOMT projekt uden for workspacet, og verificerer at hvert
  # deklareret entry-point baade resolver OG findes paa disk.
  #
  # Fandt i sin foerste koersel en aegte defekt: design-system/branding stod
  # i exports men blev aldrig bygget — MODULE_NOT_FOUND for enhver forbruger,
  # ogsaa fra npm. `exports` er et loefte; denne gate maaler om builden
  # holder det. Intet sti-filter (jf. paths-ignore-laeren fra studio #213).
  pack-smoke:
    name: Artefakt-bevis (pack + install-smoke)
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages
      - name: Pack + install-smoke
        run: node scripts/pack-smoke.mjs

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate
