name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  setup:
    name: Setup & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            packages/vue/scss
          retention-days: 1

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      # Dependabot bumps deliberately carry no changeset: merging a deps bump
      # must not force a release of the linked 2.x packages (publish-frozen on
      # develop until the main/develop reconciliation — a lower-version publish
      # would retag npm `latest` backwards). Failing this step also aborted the
      # job before ESLint/typecheck ever ran, so dependabot PRs got NO lint
      # signal at all. Skip the gate for dependabot, keep the real checks.
      - name: Check for changesets
        if: github.base_ref == 'develop' && github.actor != 'dependabot[bot]'
        run: pnpm changeset:status --since=origin/develop

      # The published 2.x line (main-era, npm latest = 2.22/2.23) is FROZEN on
      # develop until the main/develop reconciliation (Allan-call 2026-06-23):
      # develop's 2.15.x versions are BEHIND npm, so versioning+publishing them
      # from here would flip npm's `latest` tag backwards for every consumer.
      # This guard fails any PR whose changesets touch a frozen package.
      - name: Guard frozen 2.x packages
        if: github.base_ref == 'develop'
        run: |
          FROZEN='@grundtone/(core|utils|icons|vue|design-system|nuxt|react-native)'
          HITS=$(grep -rlE "$FROZEN" .changeset/*.md 2>/dev/null | grep -v README || true)
          if [ -n "$HITS" ]; then
            echo "::error::Changesets reference frozen 2.x packages (publish-frozen until main/develop reconciliation): $HITS"
            exit 1
          fi
          echo "No changesets touch the frozen 2.x line."

      - name: Run ESLint
        run: pnpm lint:js:check

      - name: Run Stylelint
        run: pnpm lint:styles:check

      - name: Check formatting
        run: pnpm lint:format

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/test-results.xml'
          retention-days: 30
          if-no-files-found: ignore

      - name: Coverage Report
        uses: codecov/codecov-action@v7
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: './coverage/lcov.info,**/coverage/lcov.info'
          fail_ci_if_error: false
          verbose: true

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [setup]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      # Pinnet til v2 bevidst. v3 gjorde build-script required OG ændrede
      # invocations-modellen til `exec(buildScript)` (rå kommando) + install
      # og build af BÅDE base- og head-ref internt — inkompatibelt med dette
      # jobs "download pre-byggede artifacts og mål dem"-design (#67's v2→v3-
      # bump brød Bundle Size Check på al develop). At adoptere v3 kræver at
      # redesigne jobbet (install-script/clean-script til pnpm-workspace) —
      # bevidst udskudt. Major-bumps af denne action ignoreres i dependabot.yml.
      - name: Analyze bundle size
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'packages/*/dist/**/*.{js,css}'
          exclude: '{**/*.map,**/node_modules/**}'
          compression: gzip

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate
