name: OSSF Scorecard

# NB: OSSF Scorecard er designet til OFFENTLIGE repos. På PRIVATE repos kræver
# det en classic PAT med `repo`-scope gemt som `SCORECARD_TOKEN` repo-secret
# (default GITHUB_TOKEN har ikke GraphQL-adgang til private commits) + sæt
# `publish_results: false`. Skabelonen nedenfor er konfigureret til offentlige
# repos; tilpas inputs hvis dit repo er privat. Se GITHUB-RULES.md "GHAS"-sektion.

on:
  schedule:
    - cron: '33 2 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # For private repos, uncomment:
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # publish_results: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
