name: OSSF Scorecard

# NB: OSSF Scorecard er designet til OFFENTLIGE repos. På PRIVATE repos kræver
# det en classic PAT med `repo`-scope gemt som `SCORECARD_TOKEN` repo-secret
# (default GITHUB_TOKEN har ikke GraphQL-adgang til private commits) + sæt
# `publish_results: false`. Skabelonen nedenfor er konfigureret til offentlige
# repos; tilpas inputs hvis dit repo er privat. Se GITHUB-RULES.md "GHAS"-sektion.

on:
  schedule:
    - cron: '33 2 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # For private repos, uncomment:
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # publish_results: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
