name: OSV-Scanner

# Direkte CLI-kald frem for reusable workflow.
# Begrundelse: reusable workflow forsøger SARIF-upload til GitHub Code Scanning,
# hvilket kræver GHAS (Code Security) aktiveret. På private repos uden GHAS
# fejler upload-stepet selv om scannen kører grønt. Direkte CLI undgår det
# trade-off — fund logges i job-output (synligt i PR-checks).
#
# Når GHAS er aktiveret org-bredt, kan vi skifte tilbage til reusable workflow
# for at få SARIF-fund i Security-tab'en.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  # 🔴 EGET JOB med eget navn, saa det kan goeres required for sig.
  #
  # osv-scanner DOES enforce `ignoreUntil` (measured 2026-10-22 on 1.9.2, 2.4.0
  # and 2.5.0: an expired accept gives the rows back, exit 1; [quality]'s
  # 2026-08-11 observation of the opposite could not be reproduced). This job
  # still earns its place: it refuses an accept without a date, checks the
  # count, and names the expired accept instead of a bare "vulnerability found".
  #
  # Ligger foer scan-jobbet i filen, men koerer uafhaengigt: et udloebt
  # ignoreUntil skal fejle SELV naar scannen er groen — det er hele pointen.
  ignore-expiry:
    name: Vuln-accepter udloeber
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # OSV_EXPECTED er ANTALLET af accepter i dette repo. Scriptet holdes
      # byte-identisk med [quality]s skabelon, saa fremtidige opdateringer kan
      # kopieres rent ind; det repo-specifikke tal bor her.
      #
      # Tallet er selv en gate: stemmer det ikke, er enten en accept forsvundet
      # eller tilfoejet uden at nogen opdaterede forventningen. "Alle 0 accepter
      # er i orden" ser plausibelt ud, hvis man ikke ved, hvad man forventer.
      - name: Assert ignoreUntil er sat og ikke passeret
        env:
          OSV_EXPECTED: '6'
        run: python3 .github/scripts/assert-osv-ignores-expire.py osv-scanner.toml
      - name: Roed-foer-groen for selve tjekket
        run: ./.github/scripts/assert-osv-ignores-expire.test.sh
      - name: Red-before-green for the anti-rot check
        run: ./.github/scripts/assert-osv-accepts-still-needed.test.sh

      # De samme saarbarheder accepteres i TO filer for TO vaerktoejer, uden et
      # faelles felt at binde dem med. Driften ville vaere tavs: én opdateres,
      # den anden glemmes.
      - name: Vuln-accepter er ens i begge lister
        run: node scripts/assert-vuln-accepts-in-sync.mjs

  scan:
    name: Dependency vuln-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install osv-scanner
        run: |
          # 🔴 CHECKSUM FØR FØRSTE EKSEKVERING (riff kqnlreckpjgm8mvjot6wvrum).
          # Formen var curl → chmod +x → `--version`: den spørger den
          # UVERIFICEREDE binær hvem den er, og kører den for at få svaret.
          # En to-linjers stub der printer versionen består.
          # Digest'et står i GIT — ikke hentet fra udgivelsens egen SHA256SUMS:
          # den kommer fra samme udgivelse som binæren og dækker transportfejl,
          # ikke en byttet udgivelse. En digest i git er et løfte nogen har målt,
          # og som en diff kan se ændre sig.
          set -euo pipefail
          OSV_SHA256="d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b"
          # 1.9.2 on purpose: the anti-rot check reads its "Scanned <path> file and
          # found <n> package" log line, and 2.4.0 rejects --skip-git (exit 127).
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          rm -f /tmp/osv-scanner
          osv-scanner --version

      # 🔴 An accept must still be NEEDED. Scan once WITHOUT any accepts (an
      # empty --config; measured 2026-10-22 on 1.9.2: it does not fall back to
      # ./osv-scanner.toml) and fail when an accepted id is no longer reported.
      # Before the real scan, so a red scan cannot skip it. Exit 1 from the
      # scanner means "vulnerabilities found" and is expected here; anything
      # above 1 is the scanner failing, which must not read as a pass.
      - name: Every accept is still needed
        run: |
          printf '' > /tmp/no-accepts.toml
          # The canary (.github/osv-canary/README.md): a known-vulnerable
          # lockfile scanned in the SAME invocation, so "every accept is stale"
          # can be told apart from "the scan saw nothing".
          mkdir -p /tmp/osv-canary
          cp .github/osv-canary/package-lock.json.canary /tmp/osv-canary/package-lock.json
          rc=0
          osv-scanner --recursive --skip-git --config=/tmp/no-accepts.toml --format json ./ /tmp/osv-canary \
            > /tmp/osv-without-accepts.json 2> /tmp/osv-without-accepts.log || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::osv-scanner exited $rc without accepts — not measured, not a pass"
            exit 2
          fi
          python3 .github/scripts/assert-osv-accepts-still-needed.py osv-scanner.toml /tmp/osv-without-accepts.json /tmp/osv-without-accepts.log

      - name: Scan dependencies
        run: |
          if [ -f osv-scanner.toml ]; then
            osv-scanner --recursive --skip-git --config=osv-scanner.toml ./
          else
            osv-scanner --recursive --skip-git ./
          fi
