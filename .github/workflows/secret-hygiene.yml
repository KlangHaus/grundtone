# Secret hygiene — a secret this repo consumes is gated by an environment, or it is named.
#
# WHY THIS LIVES HERE AND NOT ON THE JENKINS BOX (Allan 2026-10-22)
#
# Public repo = GitHub Actions, private = Jenkins. A Jenkins build's token reaches only its own
# repository under `inferRepository`, and grundtone is not a Jenkins job, so the box cannot see
# these settings. A public repo runs Actions — so the repo audits itself, with no org-scoped token
# and without adding a credential in order to audit credentials.
#
# 🔴 THE SCHEDULE IS NOT A NICETY. Surface B measures SETTINGS, and settings change without a
# commit: someone removes a branch policy in the web UI and no pull_request ever runs. A PR-only
# check would be armed against only half of what this exists for.
name: Secret hygiene

on:
  pull_request:
    # Catches a new secret reference while it is still a proposal.
    paths:
      - '.github/workflows/**'
      - 'scripts/secret-hygiene.mjs'
      - 'scripts/lib/secret-hygiene.mjs'
  push:
    branches: [develop]
  schedule:
    # Daily, so a settings change made outside a commit is found within a day.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 🔴 These are the repo's OWN pins, measured on develop (ci.yml:24 and :27), not versions
      # chosen here. The first draft of this file carried two SHAs written from memory: one did not
      # exist (it would have failed loudly) and the other DID exist in actions/checkout — so it
      # would have pinned a real but unintended revision and worked silently. A plausible wrong
      # value is worse than an empty one. Using the repo's pins also means dependabot moves this
      # workflow together with the rest instead of leaving it behind on an old revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # `.nvmrc` (24.15.0), not `.node-version` (24): measured 16 occurrences of
          # `node-version-file: '.nvmrc'` across this repo's workflows and 0 of `node-version:`,
          # so the guard runs the same Node as everything it audits.
          node-version-file: '.nvmrc'

      # No `pnpm install`: the guard is plain .mjs with no dependencies on purpose. A hygiene check
      # that needs an install can be taken down by an install failure, and then it reports nothing
      # instead of reporting a problem.
      - name: Self-test (the instrument must be valid before its verdict counts)
        run: node scripts/secret-hygiene.mjs --self-test

      # 🔴 SEQUENCE, not aggregate: if the self-test fails the guard's verdict means nothing, so it
      # must not run and be read. Inside the guard the two surfaces ARE aggregated, so one red does
      # not silence the other — [sikkerhed]'s rule for independent facts. Here the dependency is
      # real: a broken measuring tape cannot grade the wall.
      - name: Measure
        env:
          # Repository read is enough for GET /repos/{owner}/{repo}/environments on a public repo.
          # 🔴 Measured 2026-10-22 with a human admin token, i.e. as the WRONG SUBJECT. The first
          # real run on a runner is what settles whether this token suffices. A 403/404 is reported
          # as an INSTRUMENT error naming the subject (exit 2), never as a pass and never as a
          # violation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/secret-hygiene.mjs
