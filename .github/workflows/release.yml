name: Release

on:
  push:
    branches:
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

# No workflow-level grants: each job asks for exactly what it uses (riff
# zsritnday4em1si2cjh7ppig). Before the split one job held npm OIDC, repo write
# AND both Bunny storage keys, so every step of the npm publish path could read
# the CDN credentials and the docs upload ran with id-token: write.
permissions: {}

jobs:
  # Publishes the built docs site (grundtone.com architecture decision:
  # docs.grundtone.com = Bunny Edge Storage + Pull Zone, replacing Vercel
  # — see infra/docs/BUNNY-SETUP.md + infra/docs/MASTER-PLAN.md #3).
  # Runs on every push to develop, independent of whether any package was
  # released (a docs-only content change should still deploy), and skips cleanly
  # (exit 0) if the Bunny secrets are absent.
  docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    # Branch policy `develop` on this environment is what keeps the docs storage
    # key away from any other ref.
    environment: docs-deploy
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # turbo builds the docs site's @grundtone/* dependencies first (^build).
      - name: Build Docs
        run: pnpm docs:build

      - name: Publish docs to Bunny
        run: |
          pnpm --filter @grundtone/docs publish:bunny
        env:
          BUNNY_DOCS_STORAGE_ZONE: ${{ secrets.BUNNY_DOCS_STORAGE_ZONE }}
          BUNNY_DOCS_STORAGE_API_KEY: ${{ secrets.BUNNY_DOCS_STORAGE_API_KEY }}
          BUNNY_DOCS_STORAGE_REGION: ${{ vars.BUNNY_DOCS_STORAGE_REGION }}
          BUNNY_DOCS_STORAGE_PATH_PREFIX: ${{ vars.BUNNY_DOCS_STORAGE_PATH_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ci

  release:
    name: Release
    runs-on: ubuntu-latest
    # The npm trusted publisher for each package names this environment, so an
    # OIDC token minted on any other ref, or in any other job, cannot publish.
    environment: npmjs-publish
    permissions:
      contents: write # changesets pushes the version branch
      pull-requests: write # changesets opens the Version Packages PR
      id-token: write # npm OIDC trusted publishing
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0

      # NB: deliberately NO `registry-url:` here. setup-node's registry-url
      # writes an .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`;
      # with NPM_TOKEN removed (OIDC trusted publishing) that token is empty, and
      # npm treats a present-but-empty _authToken as ENEEDAUTH instead of falling
      # back to the OIDC exchange. No .npmrc auth line = clean OIDC publish.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # OIDC trusted publishing requires npm CLI >= 11.5.1. Pin to the 11.x
      # line: `npm@latest` became npm 12, which requires node >= 24.15 and
      # fails on .nvmrc's 24.13 (EBADENGINE) — that single failing step blocked
      # every develop release (incl. docs deploys) from 2026-07-10 to -13.
      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build:packages

      # Last stop before an irreversible publish. The gates below must stay in
      # this job and textually BEFORE the changesets step:
      # scripts/lib/workflow-order.test.mjs measures exactly that order.
      #
      # 🔴 The vuln gate runs HERE too, not only in ci.yml. Measured 2026-08-24:
      # `Security Audit` (pnpm audit) is required and blocks PRs, but neither it
      # nor osv ran on any release path, so a vulnerable transitive dependency
      # could ship to the consumers of nine public packages without stopping the
      # release. Same shape as the downgrade gate: the guard on the PR, the
      # irreversible action at merge.
      - name: Vuln-scan før publish
        run: |
          # 🔴 CHECKSUM BEFORE FIRST EXECUTION (riff kqnlreckpjgm8mvjot6wvrum).
          # The old form was curl → chmod +x → `--version`: it asked the
          # UNVERIFIED binary who it is, and ran it to get the answer. A two-line
          # stub that prints the version passes that.
          # The digest lives in GIT, not in the release's own SHA256SUMS: that
          # file comes from the same release as the binary and covers transport
          # errors, not a swapped release. A digest in git is a promise someone
          # measured, and a diff can see it change.
          set -euo pipefail
          OSV_SHA256="d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          rm -f /tmp/osv-scanner
          osv-scanner --recursive --skip-git --config=osv-scanner.toml ./

      # The accepted findings must be valid HERE too: an expired acceptance must
      # not carry a release through just because the scan itself says green.
      - name: Vuln-accepter er ikke udløbet
        env:
          OSV_EXPECTED: '2'
        run: python3 .github/scripts/assert-osv-ignores-expire.py osv-scanner.toml

      # Measured 2026-08-23: the release PR was merged before the nuxt fix it
      # depended on; the condition existed only in messages between people. The
      # release was stopped by the downgrade gate on an unrelated package that
      # happened to be behind — protection by coincidence, not by design. This
      # gate executes the BUILT module and fails if the wiring is missing,
      # regardless of merge order.
      - name: Udgivelses-invarianter holder på artefaktet
        run: node scripts/assert-release-invariants.mjs

      # Measured 2026-08-20: @grundtone/react-native was 2.12.0 on develop against
      # 2.22.0 on npm, and this path is the only one that would have published it.
      # The gate is general rather than a note to leave that one package out: an
      # exception nobody enforces is forgotten during exactly the combined release
      # it was meant to protect.
      - name: Ingen pakke udgives som en nedgradering
        run: node scripts/assert-no-downgrade-publish.mjs

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0 (was a BRANCH, not a tag)
        with:
          # This expects you to have a script called version-packages which runs `changeset version`
          version: pnpm version-packages
          # This expects you to have a script called release which runs `pnpm build:packages && changeset publish`
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN: publishing goes through GitHub OIDC
          # trusted publishing (id-token: write on this job + a trusted publisher
          # on npmjs per package). An empty NODE_AUTH_TOKEN here would
          # short-circuit npm to ENEEDAUTH before it ever attempts the exchange.
          # The runner has husky hooks installed via `pnpm install` (prepare
          # script); changesets' push of the Version Packages branch was being
          # killed by the pre-push tsc gate (#46's react-native errors). CI
          # already runs every real gate as workflow jobs — git hooks are a
          # local-dev safety net, not a CI one.
          HUSKY: '0'

      - name: Generate summary
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          {
            echo "### Published packages"
            echo ""
            echo '```json'
            jq '.' <<<"$PUBLISHED_PACKAGES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the compiled email-template artifacts (grundtone#6) to Bunny Edge
  # Storage so notifications' CDNRenderer can fetch them. Only when
  # @grundtone/email itself was among this run's published packages: an
  # unrelated bump (e.g. @grundtone/vue) must not re-upload an already-current
  # template version. publish-cdn.ts skips cleanly (exit 0) if the Bunny secrets
  # are absent.
  email-cdn:
    name: Publish email templates to CDN
    needs: release
    if: >-
      needs.release.outputs.published == 'true' &&
      contains(fromJSON(needs.release.outputs.publishedPackages).*.name, '@grundtone/email')
    runs-on: ubuntu-latest
    # Branch policy `develop` on this environment keeps the email storage key
    # away from any other ref, and from the npm publish job.
    environment: email-deploy
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # compile:templates runs the email package's source, which imports
      # @grundtone/core: build email and everything it depends on.
      - name: Build email and its dependencies
        run: pnpm turbo run build --filter=@grundtone/email...

      - name: Publish email templates to CDN
        run: |
          pnpm --filter @grundtone/email compile:templates
          pnpm --filter @grundtone/email publish:cdn
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_EMAIL_STORAGE_ZONE }}
          BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_EMAIL_STORAGE_API_KEY }}
          BUNNY_STORAGE_REGION: ${{ vars.BUNNY_EMAIL_STORAGE_REGION }}
          BUNNY_STORAGE_PATH_PREFIX: ${{ vars.BUNNY_EMAIL_STORAGE_PATH_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ci
