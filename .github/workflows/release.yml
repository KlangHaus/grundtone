name: Release

on:
  push:
    branches:
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  deployments: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing requires npm CLI >= 11.5.1. Node 24's bundled
      # npm may be older; force-upgrade so `changeset publish` -> `npm publish`
      # can exchange the GitHub OIDC token for a registry publish token instead
      # of falling back to NPM_TOKEN auth.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build:packages

      - name: Build Docs
        run: pnpm docs:build

      # TEMPORARY, dual-deploy transition: keep Vercel live while [infra]
      # provisions the docs.grundtone.com Bunny zone + Pull Zone and verifies
      # the Bunny-served site (see infra/docs/BUNNY-SETUP.md). Remove this
      # step in a follow-up PR once DNS has cut over — don't drop the only
      # working deploy target before its replacement is confirmed live,
      # mirroring the "records before NS-switch" discipline already used for
      # the grundtone.com DNS migration itself.
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: latest
          vercel-args: '--prod'
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}

      # Publishes the built docs site (grundtone.com architecture decision:
      # docs.grundtone.com = Bunny Edge Storage + Pull Zone, replacing Vercel
      # — see infra/docs/BUNNY-SETUP.md + infra/docs/MASTER-PLAN.md #3).
      # Skips cleanly (exit 0) until [infra] provisions the zone and sets the
      # secrets below; runs on every push to develop, independent of whether
      # any package was released this run (a docs-only content change should
      # still deploy).
      - name: Publish docs to Bunny
        run: |
          pnpm --filter @grundtone/docs publish:bunny
        env:
          BUNNY_DOCS_STORAGE_ZONE: ${{ secrets.BUNNY_DOCS_STORAGE_ZONE }}
          BUNNY_DOCS_STORAGE_API_KEY: ${{ secrets.BUNNY_DOCS_STORAGE_API_KEY }}
          BUNNY_DOCS_STORAGE_REGION: ${{ vars.BUNNY_DOCS_STORAGE_REGION }}
          BUNNY_DOCS_STORAGE_PATH_PREFIX: ${{ vars.BUNNY_DOCS_STORAGE_PATH_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ci

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This expects you to have a script called version-packages which runs `changeset version`
          version: pnpm version-packages
          # This expects you to have a script called release which runs `pnpm build:packages && changeset publish`
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "### Published packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq '.' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Publishes the compiled email-template artifacts (grundtone#6) to Bunny
      # Edge Storage so notifications' CDNRenderer can fetch them. Only runs
      # when @grundtone/email itself was among this release's published
      # packages — an unrelated package bump (e.g. @grundtone/vue) shouldn't
      # re-upload an already-current template version. publish-cdn.ts skips
      # cleanly (exit 0) if the Bunny secrets aren't provisioned yet, so this
      # step can land ahead of [infra] setting them up.
      - name: Publish email templates to CDN
        if: steps.changesets.outputs.published == 'true'
        run: |
          if echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -e '.[] | select(.name == "@grundtone/email")' > /dev/null; then
            pnpm --filter @grundtone/email compile:templates
            pnpm --filter @grundtone/email publish:cdn
          else
            echo "@grundtone/email not in this release — skipping CDN publish."
          fi
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_EMAIL_STORAGE_ZONE }}
          BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_EMAIL_STORAGE_API_KEY }}
          BUNNY_STORAGE_REGION: ${{ vars.BUNNY_EMAIL_STORAGE_REGION }}
          BUNNY_STORAGE_PATH_PREFIX: ${{ vars.BUNNY_EMAIL_STORAGE_PATH_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ci
