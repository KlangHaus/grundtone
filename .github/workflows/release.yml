name: Release

on:
  push:
    branches:
      - develop

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  deployments: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      # NB: deliberately NO `registry-url:` here. setup-node's registry-url
      # writes an .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`;
      # with NPM_TOKEN removed (OIDC trusted publishing) that token is empty, and
      # npm treats a present-but-empty _authToken as ENEEDAUTH instead of falling
      # back to the OIDC exchange. No .npmrc auth line = clean OIDC publish.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # OIDC trusted publishing requires npm CLI >= 11.5.1. Pin to the 11.x
      # line: `npm@latest` became npm 12, which requires node >= 24.15 and
      # fails on .nvmrc's 24.13 (EBADENGINE) — that single failing step blocked
      # every develop release (incl. docs deploys) from 2026-07-10 to -13.
      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build:packages

      - name: Build Docs
        run: pnpm docs:build

      # Publishes the built docs site (grundtone.com architecture decision:
      # docs.grundtone.com = Bunny Edge Storage + Pull Zone, replacing Vercel
      # — see infra/docs/BUNNY-SETUP.md + infra/docs/MASTER-PLAN.md #3).
      # Skips cleanly (exit 0) until [infra] provisions the zone and sets the
      # secrets below; runs on every push to develop, independent of whether
      # any package was released this run (a docs-only content change should
      # still deploy).
      - name: Publish docs to Bunny
        run: |
          pnpm --filter @grundtone/docs publish:bunny
        env:
          BUNNY_DOCS_STORAGE_ZONE: ${{ secrets.BUNNY_DOCS_STORAGE_ZONE }}
          BUNNY_DOCS_STORAGE_API_KEY: ${{ secrets.BUNNY_DOCS_STORAGE_API_KEY }}
          BUNNY_DOCS_STORAGE_REGION: ${{ vars.BUNNY_DOCS_STORAGE_REGION }}
          BUNNY_DOCS_STORAGE_PATH_PREFIX: ${{ vars.BUNNY_DOCS_STORAGE_PATH_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ci

      # Sidste stop foer et uigenkaldeligt publish. Maalt 2026-08-20:
      # @grundtone/react-native stod 2.12.0 paa develop mod 2.22.0 paa npm, og
      # denne sti er den eneste, der ville have udgivet den. Gaten er generel
      # frem for en note om at udelade netop den pakke — en undtagelse, ingen
      # haandhaever, bliver glemt praecis under den samlede udgivelse, den
      # skulle beskytte imod.
      # Egenskaben, ikke raekkefoelgen. 2026-08-23 blev release-PR'en merget
      # foer den nuxt-rettelse, den var betinget af; betingelsen stod kun i
      # beskeder mellem mennesker. Udgivelsen blev stoppet — men af
      # nedgraderings-vagten, paa en anden pakke der tilfaeldigvis stod bagud.
      # Vaernet virkede ved SAMMENFALD, ikke ved design.
      #
      # Denne gate eksekverer det BYGGEDE modul og fejler, hvis wiringen ikke
      # er der. Den holder uanset merge-raekkefoelge og uanset om nogen husker
      # betingelsen om tre maaneder.
      # 🔴 Vuln-gaten koerer OGSAA her, ikke kun i ci.yml.
      #
      # Maalt 2026-08-24: `Security Audit` (pnpm audit) er required og blokerer
      # PR'er — men hverken den eller osv koerte paa nogen udgivelsessti. En
      # saarbar transitiv dependency kunne dermed shippe til forbrugerne af ni
      # offentlige pakker uden at stoppe udgivelsen. Samme figur som
      # nedgraderings-vagten: vaernet paa PR-niveau, den uigenkaldelige handling
      # ved merge.
      #
      # Adopteres scanneren KUN i ci.yml, har vi to scannere paa PR-stien og
      # stadig nul her — hullet uaendret, med et groent flueben foran.
      - name: Vuln-scan før publish
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --recursive --skip-git --config=osv-scanner.toml ./

      # Accepterne skal ogsaa vaere gyldige HER: en udloebet accept maa ikke
      # kunne baere en udgivelse igennem, bare fordi scannen selv siger groent.
      - name: Vuln-accepter er ikke udløbet
        env:
          OSV_EXPECTED: '2'
        run: python3 .github/scripts/assert-osv-ignores-expire.py osv-scanner.toml

      - name: Udgivelses-invarianter holder på artefaktet
        run: node scripts/assert-release-invariants.mjs

      - name: Ingen pakke udgives som en nedgradering
        run: node scripts/assert-no-downgrade-publish.mjs

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This expects you to have a script called version-packages which runs `changeset version`
          version: pnpm version-packages
          # This expects you to have a script called release which runs `pnpm build:packages && changeset publish`
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN: publishing goes through GitHub OIDC
          # trusted publishing (id-token: write above + trusted publisher config
          # on npmjs for @grundtone/email). An empty NODE_AUTH_TOKEN here would
          # short-circuit npm to ENEEDAUTH before it ever attempts the exchange.
          # The runner has husky hooks installed via `pnpm install` (prepare
          # script); changesets' push of the Version Packages branch was being
          # killed by the pre-push tsc gate (#46's react-native errors). CI
          # already runs every real gate as workflow jobs — git hooks are a
          # local-dev safety net, not a CI one.
          HUSKY: '0'

      - name: Generate summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "### Published packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq '.' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Publishes the compiled email-template artifacts (grundtone#6) to Bunny
      # Edge Storage so notifications' CDNRenderer can fetch them. Only runs
      # when @grundtone/email itself was among this release's published
      # packages — an unrelated package bump (e.g. @grundtone/vue) shouldn't
      # re-upload an already-current template version. publish-cdn.ts skips
      # cleanly (exit 0) if the Bunny secrets aren't provisioned yet, so this
      # step can land ahead of [infra] setting them up.
      - name: Publish email templates to CDN
        if: steps.changesets.outputs.published == 'true'
        run: |
          if echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -e '.[] | select(.name == "@grundtone/email")' > /dev/null; then
            pnpm --filter @grundtone/email compile:templates
            pnpm --filter @grundtone/email publish:cdn
          else
            echo "@grundtone/email not in this release — skipping CDN publish."
          fi
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_EMAIL_STORAGE_ZONE }}
          BUNNY_STORAGE_API_KEY: ${{ secrets.BUNNY_EMAIL_STORAGE_API_KEY }}
          BUNNY_STORAGE_REGION: ${{ vars.BUNNY_EMAIL_STORAGE_REGION }}
          BUNNY_STORAGE_PATH_PREFIX: ${{ vars.BUNNY_EMAIL_STORAGE_PATH_PREFIX }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ci
