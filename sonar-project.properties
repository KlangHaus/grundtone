# SonarQube — self-hostet paa sonar.klanghaus.dk (EU, egen VM).
#
# Ét projekt for hele monorepoet, ikke ét pr. pakke. Guidens "gentag for alle
# projekter i dit monorepo" giver mening, naar pakkerne udgives og ejes
# uafhaengigt — her deler de 11 pakker byggegraf, tests og release-tog, saa
# elleve dashboards ville skulle laeses samlet alligevel. Skal en enkelt pakke
# senere skilles ud, er det en projectKey mere, ikke en omskrivning.
sonar.projectKey=KlangHaus_grundtone_7614edb4-1c54-485f-89b0-0867d3e04552
sonar.projectName=grundtone
sonar.sourceEncoding=UTF-8

# `apps/` og `scripts/` er med med vilje: apps/web er den udgivne
# grundtone.com, og scripts/ indeholder release-vaerktoejer der kan braekke et
# publish. `docs/` og `assets/` er indhold, ikke kode.
sonar.sources=packages,apps,scripts

# Tests skal ANGIVES, ikke bare udelades. Udelader man dem, taeller Sonar dem
# som utestet produktionskode og melder en daekningsgrad der er forkert i den
# pessimistiske retning — og et tal ingen tror paa, bliver ignoreret.
# 🔴 `scripts` skal med i BEGGE lister, og `.mjs` skal med i moenstret.
# [cursor] fandt det: `scripts/assert-develop-ahead-of-latest.test.mjs` laa i
# sonar.sources men hverken i sonar.tests eller i test.inclusions, og ville
# derfor vaere blevet analyseret som utestet produktionskode — praecis den
# forvraengning denne fil blev skrevet for at undgaa.
#
# En liste over "hvor koden er" og en over "hvad der er tests" skal daekke de
# samme steder, ellers bliver forskellen til et tal.
sonar.tests=packages,apps,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/__tests__/**

# Bygget output, afhaengigheder og genererede artefakter er ikke vores kode.
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/.nuxt/**,**/.output/**,**/*.d.ts,**/target/**

# 🔴 Uden denne linje rapporterer Sonar 0% daekning — og et nul laeses som en
# regression, ikke som en manglende konfiguration. Stien skal pege paa den
# lcov, `pnpm test:coverage` faktisk producerer; se vitest.config.ts, hvor
# lcov-reporteren er tilfoejet i samme aendring som denne fil.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 🔴 Coverage-exclusions for komponent-SCAFFOLDET — [quality]-godkendt i den
# SCOPEDE form (ea47a44), aldrig repo-bred: en index.ts andetsteds kan baere
# logik, og en repo-bred exclusion ville skjule den tavst (groen fordi
# naevneren blev toemt, ikke fordi koden er daekket).
#
# Baggrund ([review]s trace paa PR #128): hver ny komponentmappe foelger
# konventionen Komponent.vue + demo.vue + index.ts + types.ts. De tre sidste
# har ingen meningsfulde branches, saa new-code-gaten blev roed paa HVER ny
# komponent uanset reel daekning (Hero.vue selv: 100 %). En gate der fejler
# paa hver ny komponent laerer folk at ignorere den.
# 🔴 index.ts er scoped til kategori-mapperne EKSPLICIT, ikke `src/**`:
# Ant-style `**` matcher ogsaa NUL mapper, saa `src/**/index.ts` ramte
# rod-barrel'en `packages/vue/src/index.ts` — 8 KB der baerer selve
# CSS-bundling-importen, praecis det logik-baerende tilfaelde kommentaren
# ovenfor advarer imod ([review]-fund paa denne PR).

# apps/web/pages — SSG-marketing-site UDEN komponenttest-konvention. Lcov viser
# 0 % paa hver side (studio.vue, #125), fordi ingen test monterer dem; new-code-
# coverage maaler dermed kun "ingen tests" — allerede kendt — og er det forkerte
# instrument for mappen ([quality]-GO 16acf9c, diagnose-foer-exclusion).
#
# Det der FAKTISK daekker apps/web: build + output-assertion + smoke mod den
# offentlige URL bundet til build-sha i .github/workflows/deploy-web.yml. En
# SSG-side er bevist naar den bygger og svarer med DENNE commit, ikke naar dens
# statements er besoegt af en unit-test.
#
# apps/web/components er samme klasse (udvidet 2026-08-19, [review]-fund paa
# #140: 35 % new-code, SiteHeader/SiteFooter = <picture>-markup + ÉN branch
# `route.path.startsWith('/studio')` + `getFullYear()`; apps/web har INGEN
# test-konvention, hverken pages eller components). Beslutningen er navngivet
# her frem for at lade gaten staa stille roed. Maalt foer valget: ingen logik
# der fortjener en unit-test — det baerende er stadig build + sha-smoke.
#
# apps/web/scripts/*.mjs — ORKESTRERINGSLAGET (hent, resize, skriv, print).
# 🔴 Graensen er bevidst lagt ved lib/-skellet ([quality] 554696a):
# `apps/web/scripts/lib/**` er ALDRIG ekskluderet, saa BESLUTNINGERNE
# (drift-status, filnavne, manifest-format) maales — kun I/O-orkestreringen
# undtages. Konsekvens: en beslutning der sniger sig ud i et script viser sig
# som et coverage-fald i stedet for at forsvinde i undtagelsen.
# Maalt foer valget (#142): lib'en 100 % og mutations-testet 3/3 roede;
# resten var fetchSource + main-blokken. En test der mocker sharp og fs for at
# assertere at writeFileSync blev kaldt, paastaar kun at koden er den den er.
# Praecedens i samme lcov: rod-scriptet assert-develop-ahead-of-latest.mjs har
# LH:0 og foelger allerede lib/-moensteret — det slipper kun for gaten ved
# ikke at vaere ny kode.
#
# KUN coverage-naevneren undtages: issues/hotspots/duplikation maales fortsat.
# 🔴 EXIT-BETINGELSER: fjern apps/web/pages+components den dag apps/web faar en
# komponenttest-konvention, og apps/web/scripts/*.mjs den dag scripts faar en
# e2e-testkonvention med mockede afhaengigheder — ellers bliver undtagelserne
# permanente af glemsel.
#
# 🔴 ÉN linje baerer BEGGE blokke ovenfor med vilje: Sonar-properties er
# last-wins, saa to `sonar.coverage.exclusions=`-linjer ville tavst slette den
# foerste. Tilfoej til listen — opret aldrig en linje mere.
#
# 🔴 De navngivne scripts/-filer: snittet er BESLUTNING vs. ORKESTRERING, ikke
# mappe. `scripts/lib/**` er hvor gatene traeffer deres valg og er ALDRIG
# undtaget; de filer skal testes. Scripts'ene laeser filer, kalder lib, printer.
#
# NAVNGIVNE filer, ikke moensteret `scripts/*.mjs`: et moenster ville tavst
# opsluge fremtidige scripts, ingen har laest.
#
# Betingelsen der gik forud ([quality] 2026-08-20): tests af beslutningskoden
# FOERST, exclusion i samme leverance eller slet ikke. Den raekkefoelge var
# ikke ceremoni — testene afdaekkede en VENDT prerelease-sammenligning i
# semver-gt og en UGYLDIG version-stempling. Var exclusionen skrevet foerst for
# at faa tallet groent, ville begge have overlevet inde i nedgraderings-vagten.
#
# EXIT-BETINGELSE: flyttes en beslutning tilbage ind i et af disse scripts,
# skal filen ud af listen igen. Undtagelsen daekker fravaeret af LOGIK, ikke
# fravaeret af tests.
sonar.coverage.exclusions=packages/vue/src/**/demo.vue,packages/vue/src/atoms/**/index.ts,packages/vue/src/molecules/**/index.ts,packages/vue/src/organisms/**/index.ts,packages/vue/src/**/types.ts,apps/web/pages/**,apps/web/components/**,apps/web/scripts/*.mjs,scripts/assert-no-public-api-loss.mjs,scripts/assert-no-downgrade-publish.mjs,scripts/assert-no-undefined-css-vars.mjs,scripts/assert-develop-ahead-of-latest.mjs,scripts/pack-smoke.mjs,scripts/prerelease-next-version.mjs,scripts/assert-release-invariants.mjs,scripts/assert-environment-gates.mjs,scripts/assert-vuln-accepts-in-sync.mjs,scripts/assert-flade-metadata.mjs
