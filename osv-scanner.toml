[[IgnoredVulns]]
id = "GHSA-vjh5-4x84-xrqp"
ignoreUntil = 2026-11-11T00:00:00Z
reason = """
FALSE POSITIVE in OSV's data, not in the code. Nuxt server-side route rules.
GitHub's advisory bounds all four ranges: nuxt >= 4.0.0, < 4.6.2 (patched 4.6.2)
and >= 3.0.0, < 4.0.0 (no patch); @nuxt/nitro-server >= 4.2.0, < 4.6.2 and
>= 3.20.0, < 4.0.0. OSV's record (modified 2026-10-22T17:15Z) carries the two
legacy ranges as `introduced` with no `fixed` / `last_affected`, i.e. unbounded
above, so it flags nuxt 4.6.2 and @nuxt/nitro-server 4.6.2, which GitHub lists
as patched. The lockfile holds no nuxt 3.x. One accept by id covers both
packages (measured: 2 rows -> 0).
Exit: falls away when OSV's record terminates `introduced: 3.0.0` (nuxt) and
`introduced: 3.20.0` (@nuxt/nitro-server). Check:
  curl -s https://api.osv.dev/v1/vulns/GHSA-vjh5-4x84-xrqp
The anti-rot check fails the day OSV stops reporting it, so it cannot outlive
the error. The 7-day date is a forced re-read, not the exit condition.
Re-read 2026-10-27T23:08Z by [grundtone], before the 2026-10-29 expiry:
  - OSV record: `modified` still 2026-10-22T17:15:04Z; both legacy ranges still
    `introduced` only (nuxt 3.0.0, @nuxt/nitro-server 3.20.0).
  - GitHub advisory (updated 2026-10-22T16:59:57Z): all four ranges bounded,
    4.6.2 patched — unchanged.
  - osv-scanner 1.9.2 (sha256 d6af4b67…), no accepts, develop d432bf2: still
    flags nuxt@4.6.2 and @nuxt/nitro-server@4.6.2; the canary
    (GHSA-p6mc-m468-83gw, lodash 4.17.15) reported in the same run.
  Renewed 7 days. A renewal needs a second party's dated reading ([sikkerhed]).
Re-read 2026-11-01T20:20Z by [grundtone], before the 2026-11-04 expiry:
  - OSV record and GitHub advisory: both unchanged since 2026-10-22 (same
    `modified` / `updated_at`, same four ranges).
  - osv-scanner 1.9.2 (sha256 d6af4b67…, re-downloaded and verified), no
    accepts, develop 0ad6cc4: still flags nuxt@4.6.2 and
    @nuxt/nitro-server@4.6.2; the canary reported in the same run.
  Renewed 7 days, to 2026-11-11.
"""

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-11-24T00:00:00Z
reason = """
deepmerge prototype poisoning in mergeObject(). NO patch exists: OSV and GitHub
both give affected >=4.2.0 <=4.3.1 with no fixed version, and 4.3.1 is npm's
latest, so an override cannot fix it.
Owner: [grundtone]. Added 2026-11-07 to unblock the npm release gate.
Paths (pnpm why, develop 0ca60ad7):
  - @grundtone/email -> html-to-text 9.0.5 -> deepmerge (published runtime path).
    html-to-text calls deepmerge only in compile() to merge DEFAULT_OPTIONS with
    the caller's options, and in its selector merge. @grundtone/email's
    toPlainText (packages/email/src/compile.ts l.74-80) passes our own
    constants (three fixed selectors) plus a typed `wordwrap: number | false`;
    the HTML being converted is never merged. Not reachable as used: no
    attacker-controlled source object reaches deepmerge from our code.
    Approved by Allan 2026-11-07 ("ja, accepter deepmerge til 24. november").
  - @rollup/plugin-node-resolve (build tooling) and @expo/config
    (apps/playground/expo): not shipped.
Exit: falls away when (a) deepmerge publishes a fixed version and the lockfile
moves to it, OR (b) html-to-text drops deepmerge or @grundtone/email replaces
html-to-text. The anti-rot check fails the day OSV stops reporting it. The date
is a forced re-read, not the exit condition.
"""
