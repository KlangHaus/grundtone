[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-24T00:00:00Z
reason = """
braces stack-exhaustion DoS via dybt indlejrede mønstre. INGEN patch findes:
verificeret mod registret, ikke kun mod auditens `<0.0.0`-kodning — nyeste
udgivne braces ER 3.0.3, og advisory'et dækker `<=3.0.3`. Nåbar udelukkende via
apps/playground/expo -> expo -> @expo/metro -> metro-file-map: et playground,
der aldrig shippes, og ingen publiceret @grundtone-pakke har braces som direkte
afhængighed. Samme advisory undtages ved navn i grundtone-studio (#343).
Accepten falder bort når (a) braces udgiver en patch, ELLER (b)
expo-playgroundet fjernes.
"""

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-11-24T00:00:00Z
reason = """
node-forge: RSA PKCS#1 v1.5-signaturverifikation accepterer ekstra indlejrede
DigestAlgorithm-elementer. 🔴 Det er en signaturverifikations-svaghed, ikke en
DoS — en tungere klasse end de øvrige accepter her, og den undtages UDELUKKENDE
på nåbarhed. INGEN patch: nyeste udgivne node-forge ER 1.4.0, og advisory'et
dækker `<=1.4.0`. Nåbar via apps/playground/expo -> @expo/cli, som bruger den
til at udstede et selvsigneret certifikat til dev-serveren. Samme advisory
undtages ved navn i grundtone-studio (#343). Accepten falder bort når (a)
node-forge udgiver en patch, ELLER (b) expo-playgroundet fjernes.
"""

[[IgnoredVulns]]
id = "GHSA-x6jw-m9v5-85vh"
ignoreUntil = 2026-11-24T00:00:00Z
reason = """
simple-git: `VISUAL`-miljøvariablen udelades fra usikker editor-detektion
(kritisk). Patch findes — simple-git >=4.0.1 — men den kan vi ikke tage: en
override til 4.x BRÆKKER BYGGERIET. simple-git 4 droppede default-eksporten,
@nuxt/devtools importerer, så apps/studio's `nuxt prepare` fejler ved install med
«does not provide an export named 'default'». Målt i grundtone-studio og
dokumenteret i dets pnpm-workspace.yaml. Ingen udgivet @nuxt/devtools op til
3.4.2 erklærer simple-git 4, så der er heller ingen opstrøms kur — det er også
derfor Dependabots security-kørsler for kæden fejler frem for at åbne PR'er.
Nåbar via apps/playground/nuxt -> nuxt -> @nuxt/devtools. 🔴 Accepten falder
bort når @nuxt/devtools udgiver simple-git 4 — det er den ENE blokering tilbage
i både grundtone og grundtone-studio.
"""

