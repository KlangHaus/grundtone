# Vuln-accepter for osv-scanner.
#
# osv-scanner DOES enforce `ignoreUntil`: an expired date stops filtering the
# advisory, and the scan fails as if there were no accept. Measured 2026-10-22 by
# [grundtone] on osv-scanner 1.9.2 (CI's pinned binary), 2.4.0 and 2.5.0, with the
# date written as an unquoted timestamp, a quoted string and a plain date: every
# expired accept gave the rows back and exit 1. [quality]'s observation of
# 2026-08-11 (v2.5.0, "an expired date suppresses fully, exit 0") could NOT be
# reproduced.
# `assert-osv-ignores-expire.py` still runs as its own job: it refuses an accept
# WITHOUT a date, it checks the count, and it names the expired accept instead of
# leaving a bare "vulnerability found".
#
# 🔴 An accept must still be NEEDED. The scan job also scans WITHOUT these
# accepts (`assert-osv-accepts-still-needed.py`) and fails when an accepted id is
# no longer reported, so a stale accept is removed instead of riding along.
#
# Samme accepter står i `pnpm-workspace.yaml` for `pnpm audit`. **To lister
# over de samme fund kan drive fra hinanden** — de har hver sit værktøj og
# hvert sit format, og der findes ikke et fælles felt at binde dem med. Ændres
# den ene, skal den anden med.

[[IgnoredVulns]]
