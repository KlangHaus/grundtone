packages:
  - packages/*
  - apps/*
  - apps/playground/*

ignoredBuiltDependencies:
  - unrs-resolver

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

overrides:
  # Gulve tilfoejet 2026-10-10, alle BUNDNE til deres egen major.
  '@modelcontextprotocol/sdk': '>=1.31.0 <2'
  compression: '>=1.8.2 <2'
  source-map-js: '>=1.2.2 <2'
  # 🔴 FLYTTET HERTIL 2026-10-10 FRA package.json's `pnpm.overrides`, hvor #245
  # satte den. Den placering annullerede #207 ("keep every pnpm override in one
  # file") i TAVSHED: med en `pnpm`-noegle i package.json optegnede lockfilen 1
  # override i stedet for 67, og hver advisory-floor i denne fil var inert.
  # Maalt: med noeglen gav shell-quote 1.10.0 og proxy-addr 2.0.7; uden den
  # 1.12.0 og 2.0.8, og lockfilens overrides-antal gik 1 -> 67.
  #
  # #245's eget vaern (assert-single-vue.mjs) var groent hele tiden — det maaler
  # vue, og vue VAR én kopi. Et vaern der maaler sin egen sag er blind for den
  # mekanisme det deler med 66 andre.
  vue: $vue
  # GHSA-w7jw-789q-3m8p + GHSA-pqg4-j6r4-53mv — critical: shell-quote quote()
  # does not escape newlines in object .op values, and a later parse() DoS.
  # Patched 1.11.0. Reached only through apps/playground/expo > react-native >
  # react-devtools, i.e. dev tooling in a playground app — but the gate scans the
  # tree, not the blast radius. Bounded to 1.x by the caret, deliberately: a floor
  # written against one advisory is not a guard against the next, and an unbounded
  # range lets the resolution climb a major where the fix floor sits elsewhere.
  shell-quote: ^1.11.0
  # GHSA — critical: proxy-addr. Patched 2.0.8. Transitive via
  # packages/mcp > @modelcontextprotocol/sdk > express > proxy-addr. Bounded to
  # 2.x for the same reason as above.
  proxy-addr: '>=2.0.8 <3'
  # 🔴 REMOVED with this change: `react-native: 0.81.5` and
  # `react-devtools-core: 6.1.5`. Both were exact pins that lived here while
  # this file was inert, so they never bore. MEASURED both ways: deleting them
  # from the old split setup changes the lockfile by 0 lines, while carrying
  # them into the single effective set downgrades react-native 0.87.1 -> 0.81.5
  # and drags a whole jest-preset chain in (64 packages out, 52 in). A pin
  # nobody has been running for months is not a floor we can raise silently;
  # the expo playground declares 0.87.1 itself.
  '@eslint/plugin-kit@<0.3.4': '>=0.3.4'
  '@octokit/plugin-paginate-rest@>=1.0.0 <9.2.2': '>=9.2.2'
  '@octokit/request-error@>=1.0.0 <5.1.1': '>=5.1.1'
  '@octokit/request@>=1.0.0 <8.4.1': '>=8.4.1'
  devalue@<5.3.2: '>=5.3.2'
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  glob@>=11.0.0 <11.1.0: '>=11.1.0'
  js-yaml@>=4.0.0 <4.1.1: '>=4.1.1'
  nuxt@>=3.6.0 <3.19.0: '>=3.19.0'
  playwright@<1.55.1: '>=1.55.1'
  tar@=7.5.1: '>=7.5.2'
  tmp@<=0.2.3: '>=0.2.4'
  valibot@>=0.31.0 <1.2.0: '>=1.2.0'
  vite@>=6.0.0 <=6.3.5: '>=6.3.6'
  vite@>=7.1.0 <=7.1.10: '>=7.1.11'
  vite@>=7.1.0 <=7.1.4: '>=7.1.5'
  # Moved here from package.json's `pnpm.overrides` (riff da3hho2c/KH-586).
  # 🔴 MEASURED on develop 97e4bb9, not assumed: the lockfile's resolved
  # `overrides:` block held exactly these 52 keys, and 15 of the keys that
  # already lived in this file were absent from it — i.e. package.json was the
  # set that BORE, and part of this file was inert. pnpm warns that it no
  # longer reads the package.json field; the warning was wrong for these
  # versions, which is why splitting them across two files was invisible.
  # One file, one set: what is written here is what resolves.
  file-type: '>=16.5.4'
  node-fetch: '>=2.6.7'
  glob: '>=11.1.0'
  '@octokit/request-error': '>=5.1.1'
  '@octokit/request': '>=8.4.1'
  '@octokit/plugin-paginate-rest': '>=9.2.2'
  esbuild: '>=0.28.1'
  flatted: '>=3.4.2'
  minimatch: '>=9.0.7'
  node-forge: '>=1.4.0'
  picomatch: '>=4.0.4'
  serialize-javascript: '>=7.0.5'
  tar: '>=7.5.21'
  srvx: '>=0.11.13'
  yaml: '>=2.8.3'
  html-minifier: 'npm:html-minifier-terser@^7.2.0'
  js-cookie: '>=3.0.7'
  defu: '>=6.1.5'
  '@xmldom/xmldom': '>=0.8.13'
  simple-git: '>=3.36.0'
  fast-uri: '>=4.1.3 <5'
  devalue: '>=5.9.3 <6'
  unhead: '>=2.1.13'
  postcss: '>=8.5.18'
  nitropack: '>=2.13.4'
  ws: '>=8.20.1'
  nuxt: '>=4.4.6'
  uuid: '>=11.1.1'
  tmp: '>=0.2.6'
  turbo: '>=2.9.14'
  undici: '>=6.27.0'
  vite: '>=6.4.3'
  svgo: '^4.1.0'
  markdown-it: '>=14.2.0'
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0'
  'brace-expansion@<1.1.18': '^1.1.18'
  'brace-expansion@>=2.0.0 <2.1.4': '^2.1.4'
  'brace-expansion@>=3.0.0 <3.0.6': '^3.0.6'
  'brace-expansion@>=4.0.0 <5.0.9': '^5.0.9'
  'hono@<4.13.7': '^4.13.7'
  'lodash-es@<4.18.0': '^4.18.0'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'nanoid@<3.3.17': '^3.3.17'
  'qs@<6.16.0': '>=6.16.0'
  '@xmldom/xmldom@<0.9.12': '>=0.9.12'
  'decode-uri-component@<0.5.0': '>=0.5.0'
  '@humanfs/node@<0.16.8': '>=0.16.8'
  'js-yaml@<3.15.2': '^3.15.2'
  'colord@<2.9.4': '^2.9.4'

# Vuln-accepter for `pnpm audit`. Her frem for i package.json, fordi JSON ikke
# kan baere en begrundelse — og en accept uden begrundelse er praecis den
# doedvaegt, denne aendring rydder ud ([jura], consent-tekster.md).
#
# Maalt: naar package.json IKKE har auditConfig, er det denne fil der gaelder.
# (Har begge den, VINDER package.json — se reference-noten om prioritering.)
auditConfig:
  ignoreGhsas:
    # 🔴 TILFOEJET 2026-10-10. Seks id'er, og kun seks: hver af dem er maalt
    # uafhjaelpelig FOR OS, og alle tre pakker kommer ind gennem
    # apps/playground/* — demo-apps, ikke publicerede pakker. Ingen af dem er
    # direkte afhaengighed i nogen publiceret @grundtone-pakke, saa de kan ikke
    # naa en forbruger af biblioteket. `pnpm audit --prod` scanner hele
    # workspacets prod-lukning, playground-apps inklusive; det er derfor de
    # taelles.
    #
    # NAVNGIVNE, ikke `--ignore-unfixable`. Blankotaeppet absorberer ogsaa det
    # NAESTE uafhjaelpelige fund, inklusive et kritisk, uden at nogen beslutter
    # det. Seks id'er lader et syvende advisory goere gaten roed.
    #
    # braces (via expo > @expo/metro) og node-forge (via expo > @expo/cli):
    # ingen patch findes. Verificeret mod registret, ikke kun mod auditens
    # `<0.0.0`-kodning: nyeste udgivne braces ER 3.0.3 og node-forge ER 1.4.0,
    # begge inde i deres eget advisory-span. Samme to undtages ved navn i
    # grundtone-studio (#343).
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv
    # simple-git-kaeden (via playground/nuxt > nuxt > @nuxt/devtools): kraever
    # simple-git >=4.0.1, og en override DER brakker byggeriet — simple-git 4
    # droppede default-eksporten @nuxt/devtools importerer, saa `nuxt prepare`
    # fejler ved install. Maalt i studio og dokumenteret i dets
    # pnpm-workspace.yaml. Ingen udgivet @nuxt/devtools op til 3.4.2 bruger
    # simple-git 4, saa der er heller ingen opstroems kur. FJERN DISSE FIRE naar
    # devtools udgiver simple-git 4 — det er den ene blokering tilbage i BEGGE
    # repoer.
    - GHSA-x6jw-m9v5-85vh
    - GHSA-v5rq-49vh-5v5c
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    # GHSA-5p2g-fcmc-qvqq · GHSA-w3rx-r6r6-pgpr — image-size DoS i ICNS- og
    # JXL/HEIF-parserne. **Der findes INGEN patch**: advisory'et angiver
    # `Patched versions <0.0.0`, og npms nyeste (2.0.2) er selv saarbar. En
    # override er derfor ikke mulig — det er ikke et valg mellem fix og accept.
    #
    # Naabarhed: udelukkende via apps/playground/expo -> expo -> @expo/metro
    # -> metro. Et PLAYGROUND, der aldrig shippes, og som parser billeder, vi
    # selv laegger ind.
    #
    # 🔴 EXIT: falder bort naar (a) image-size udgiver en patch, ELLER
    # (b) expo-playgroundet fjernes. (b) er sandsynlig — produkt-taksonomien
    # siger NativeScript, ikke Expo.
    #
    # 🔴 DEADLINE: 2026-11-24T00:00:00Z. Den STAAR i `osv-scanner.toml`
    # (`ignoreUntil` paa begge GHSA'er) og haandhaeves af
    # `.github/scripts/assert-osv-ignores-expire.py` som eget job — osv-scanner
    # selv ignorerer datoen. `scripts/assert-vuln-accepts-in-sync.mjs` binder
    # de to lister, saa den dag deadlinen falder, faelder CI accepten HER ogsaa.
    # Den tidligere formulering ("genvurdér paa haendelsen, ikke paa en dato")
    # laeste som en accept UDEN udloeb (riff v8e8x8in/KH-937); maalt er det
    # forkert — der er en tvungen genvurdering, den bor bare i den anden fil.
    # Aendrer du datoen, skal den aendres BEGGE steder.
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
